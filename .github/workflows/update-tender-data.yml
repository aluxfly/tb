name: Update Tender Data

on:
  schedule:
    - cron: '0 2 * * *'  # 每日 2:00
  workflow_dispatch:     # 支持手动触发

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 这里可以添加 bs4 等依赖（当前版本用内置数据）

      - name: Scrape tender data
        run: |
          python scrape_tender.py > tender_data.json
          echo "✅ 抓取完成，数据条目：$(jq '.items | length' tender_data.json)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tender_data.json
          if git diff --cached --quiet; then
            echo "✅ 数据无变化，跳过提交"
          else
            git commit -m "chore: 更新招标数据 $(date +'%Y-%m-%d')"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ 数据已推送"
          fi